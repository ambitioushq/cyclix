name: Docs

# Builds the docs site in docs/ on every PR and push to main that touches it, so a
# broken link fails the PR. Cloudflare's Git integration deploys the site from main.
# See docs/README.md.

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      - name: Install the site's packages
        working-directory: docs
        run: npm ci
      # The build fails when a link reaches no page or heading.
      - name: Build the site
        working-directory: docs
        run: npm run build
