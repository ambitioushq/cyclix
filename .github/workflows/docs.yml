name: Docs

# Builds the docs site from docs/ on every PR that touches it, and deploys it to
# Cloudflare Pages from main. See site/README.md.

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - name: Install the site's packages
        working-directory: site
        run: npm ci
      # The build fails when a link reaches no page or heading.
      - name: Build the site
        working-directory: site
        run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/dist
          retention-days: 1

  # A separate job, so the Cloudflare secrets never reach the job that ran npm ci.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ambitioushq/cyclix'
    runs-on: ubuntu-latest
    # Two deploys at once could finish out of order and leave an older site live.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned, because the action installs Wrangler from npm when it runs.
          # Dependabot cannot see this version, so it is raised by hand.
          wranglerVersion: "4.156.0"
          command: pages deploy dist --project-name=cyclix-docs --branch=main
