name: Sandbox

# Runs the @sandbox scenarios and records the gh shapes against the real sandbox
# repo and board. By hand and weekly, never on a PR. See tests/README.md, "The sandbox".

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

permissions: {}

# Two runs at once would admit each other's issues.
concurrency:
  group: sandbox

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment holds the sandbox secrets, so only runs from main can read them.
    environment: sandbox
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CYCLIX_SANDBOX_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CYCLIX_SANDBOX: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Install Claude Code
        # Pinned, because this job holds the sandbox tokens. Dependabot cannot bump a
        # global npm install, so the version is raised by hand.
        run: npm install -g @anthropic-ai/claude-code@2.1.282 # zizmor: ignore[adhoc-packages]
      - name: Let git push with the sandbox token, and commit as the sandbox
        run: |
          gh auth setup-git
          git config --global user.name "Cyclix sandbox"
          git config --global user.email "sandbox@invalid"
      - name: Run the sandbox scenarios
        run: uv run pytest -m sandbox
      - name: Record the gh shapes
        if: ${{ !cancelled() }}
        run: uv run python scripts/record_gh_shapes.py
      # A new gh version alone is not a change of shape.
      - name: Fail if real gh output changed shape
        if: ${{ !cancelled() }}
        run: git diff --exit-code -I '"gh":' tests/fixtures/gh-shapes
