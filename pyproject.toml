[project]
name = "cyclix"
version = "0.0.1"
description = "An engine for an unattended issue-to-PR loop. Pre-release."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cyclix = "cyclix.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "pytest-bdd", "ruff", "coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
markers = ["issue-2: scenarios introduced by #2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.coverage.run]
source = ["cyclix"]
branch = true
patch = ["subprocess"]
