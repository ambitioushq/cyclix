[project]
name = "cyclix"
version = "0.0.1"
description = "An engine for an unattended issue-to-PR loop. Pre-release."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# Shell completion. ADR-0008 gives the reason for this dependency.
extras = ["argcomplete>=3"]

[project.scripts]
cyclix = "cyclix.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["argcomplete>=3", "pytest", "pytest-bdd", "ruff", "coverage", "zizmor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
bdd_features_base_dir = "tests/features"

[tool.ruff]
line-length = 100
extend-include = ["tests/fakes/bin/*"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "TD003", "ERA001"]

[tool.ruff.lint.per-file-ignores]
# A test comment may show worked arithmetic, which ERA001 reads as commented-out code.
"tests/**" = ["ERA001"]

[tool.coverage.run]
source = ["cyclix"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 98
