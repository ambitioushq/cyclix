# The sandbox tenant: a throwaway repo and board that the sandbox scenarios and
# scripts/record_gh_shapes.py run against. See tests/README.md, "The sandbox".

[tenant]
name = "sandbox"

[tracker]
kind = "github"
owner = "ambitioushq"
project = 2
status_field = "Status"

[tracker.states]
ready = "Ready"
in_progress = "In progress"
in_review = "In review"
parked = "Parked"
needs_decision = "Needs decision"
done = "Done"

[codehost]
kind = "github"
repo = "ambitioushq/cyclix-sandbox"
base = "main"

[agent]
# The engine adds the model, the caps and the permission flags for each stage.
# See docs/design/isolation.md.
command = ["claude", "-p", "--output-format", "json"]
timeout_minutes = 20
pass_env = []

[agent.plan]
model = "claude-sonnet-5-5"
max_turns = 30
max_budget_usd = 2.0
tools = ["Read", "Grep", "Glob"]

[agent.build]
model = "claude-sonnet-5-5"
max_turns = 100
max_budget_usd = 5.0
tools = ["Read", "Grep", "Glob", "Edit", "Write",
         "Bash(git add *)", "Bash(git commit *)", "Bash(git status*)",
         "Bash(git diff*)", "Bash(git log*)", "Bash(python3 -m unittest*)"]

[gate]
commands = [["python3", "-m", "unittest"]]
pass_env = []

[limits]
runs_per_day = 6
