# The sandbox tenant: a throwaway repo and board that the sandbox scenarios and
# scripts/record_gh_shapes.py run against. See tests/README.md, "The sandbox".

[tenant]
name = "sandbox"

[tracker]
kind = "github"
owner = "ambitioushq"
project = 2
status_field = "Status"

[tracker.states]
ready = "Ready"
in_progress = "In progress"
in_review = "In review"
parked = "Parked"
needs_decision = "Needs decision"
done = "Done"

[codehost]
kind = "github"
repo = "ambitioushq/cyclix-sandbox"
base = "main"

[agent]
# Print mode cannot ask before it edits a file or runs git, so the sandbox run
# lets the agent act without asking. It runs on a throwaway CI machine.
command = ["claude", "-p", "--output-format", "json", "--permission-mode", "bypassPermissions"]
model_plan = "claude-sonnet-5-5"
model_build = "claude-sonnet-5-5"
timeout_minutes = 20

[gate]
commands = [["python3", "-m", "unittest"]]

[limits]
runs_per_day = 6
